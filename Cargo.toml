[workspace]
resolver = "3"
members = ["crates/privora-core", "crates/privora-wasm", "tools/corpus-gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Vassel Goleyu"]
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
